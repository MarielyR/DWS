<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title></title>
    <style>
        
        .container {
            background-color: rgba(245, 64, 19, 0.8); /* Cor de fundo com transparência */
            display: flex;
            justify-content: space-between;
            width: 80%; /* Largura do contêiner */
            height: auto; /* Altura do contêiner se ajusta ao conteúdo */
            margin: auto;
            border-radius: 15px; /* Bordas arredondadas */
            padding: 80px; /* Adiciona um pouco de espaço interno */
        }
        .column {
            width: 48%;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 3px solid rgb(216, 62, 41);
            border-radius: 10px;
            background-color: white;
            color: black;
        }
        input:focus {
            background-color: rgb(255, 148, 163);
        }
        .buttons-container {
            display: flex;
            justify-content: space-between;
            width: 80%;
            margin: 20px auto;
        }
        .button-esquerda input[type=reset] {
            background-color: #FF5733;
            border: none;
            color: white;
            padding: 10px 20px;
        }
        .button-direita input[type=submit] {
            background-color: #FF5733;
            border: none;
            color: white;
            padding: 10px 20px;
        }
        body {
            
            color: rgb(0, 0, 0);
            font-family: "Prompt", sans-serif;
            font-weight: 250vw;
            font-style: normal;
            background-image: url('https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/e80d6d80-a67f-4933-8cf2-9e60f6508615/d37h3c2-c5cb6513-68ca-4b14-ba78-ba03e307c643.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiJcL2ZcL2U4MGQ2ZDgwLWE2N2YtNDkzMy04Y2YyLTllNjBmNjUwODYxNVwvZDM3aDNjMi1jNWNiNjUxMy02OGNhLTRiMTQtYmE3OC1iYTAzZTMwN2M2NDMuanBnIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.WZkHukGhqd-R9mIIsQROcmt9KPb-EVOjovsQY-qt0Y0');
            background-size: cover; /* Faz a imagem cobrir todo o fundo */
            background-position: center; /* Centraliza a imagem */
            background-repeat: no-repeat; /* Não repete a imagem */
            margin: 0; /* Remove margens padrão do body */
            height: 100vh; /* Define a altura do body para 100% da altura da viewport */
        }
        h1{
            text-align: center; 
        }
    </style>
</head>
<body>
    <h1>Validação em Formulários HTML</h1>
    <form action="destino.html">
        <div class="container">
            <div class="column">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
                
                
                <label for="email">E-mail:</label>
                <input type="email" name="email" required placeholder="Digite seu email" >
                
                <label for="telefone">Telefone:</label>
<input type="tel" name="phone" required placeholder="(DD)XXXXX-XXXX" pattern="\([0-9]{2}\)[0-9]{4,6}-[0-9]{3,4}$">

                
                <label for="cpf">CPF:</label>
                <input type="text" name="cpf" required placeholder="xxx.xxx.xxx-xx" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
                
                <label for="data">Data do cadastro:</label>
                <input type="date" id="data" name="data" required>
                
                <label for="homepage">Endereco URL:</label>
                <input type="url" id="homepage" name="homepage" required>
            </div>
            
            <div class="column">
                <label for="nota">Nota (0 a 10):</label>
                <input type="number" id="nota" name="nota" min="0" max="10" required>
                
                <label for="inputZip">CEP:</label>
                <input type="text" id="inputZip" required placeholder="XX.XXX-XXX" pattern="\d{2}\.\d{3}-\d{3}">
                
                <label for="inputAddress">Endereço:</label>
                <input type="text" id="inputAddress" required placeholder="Rua, nº e bairro">
                
                <label for="cidades">Cidade onde mora:</label>
                <select name="cidades" id="cidades">
                    <option value="">Escolha uma cidade</option>
                    <option value="nhandeara">Nhandeara</option>
                    <option value="cardoso">Cardoso</option>
                    <option value="votuporanga">Votuporanga</option>
                    <option value="cosmorama">Cosmorama</option>
                    <option value="Estrela D'Oeste">Estrela D'Oeste</option>
                </select>
                
                <label for="img">Foto de perfil:</label>
                <input type="file" id="img" name="img" accept="image/*" required>
                
                <label for="contrato">Contrato Assinado (PDF):</label>
                <input type="file" id="contrato" name="contrato" accept=".pdf" required>
            </div>
        </div>
        
        <div class="buttons-container">
            <div class="button-esquerda">
                <input type="reset" value="Limpar">
            </div>
            <div class="button-direita">
                <input type="submit" value="Enviar">
            </div>
        </div>
    </form>
</body>
</html>
